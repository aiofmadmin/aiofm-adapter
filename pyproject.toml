[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiofm-adapter"
version = "0.1.0"
description = "Universal Python REST adapter for dash.aiofm.cc agent workspaces"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "aiofm" }
]
license = { text = "MIT" }
keywords = ["aiofm", "agent", "adapter", "rest", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]

[project.scripts]
aiofm-adapter = "aiofm_adapter.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
